# @file: .github/workflows/quality-gate.yml
# Portão de qualidade em máquina limpa: a rede de segurança final, no push e
# no PR. Roda scripts/quality-gate.sh --full --all --base <commit de antes>:
# só aqui o cargo-deny confere advisories (vulnerabilidade publicada hoje não
# trava commit local, mas aparece no primeiro push). O portão roda no macOS,
# o alvo principal e a máquina de desenvolvimento (docs/BRIEF.md decisão 5).
# O job "build" confirma que o workspace compila e passa nos testes em Linux e
# Windows, os builds secundários.

name: Portão de qualidade

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Toda segunda, 7h BRT: advisory publicado depois do último push aparece
  # mesmo sem commit novo.
  schedule:
    - cron: '0 10 * * 1'

concurrency:
  group: quality-gate-${{ github.ref }}
  # Só PR cancela o anterior. Em push na main, cancelar o run de A faria o de B
  # comparar com o HEAD de A, e os commits de A nunca seriam verificados.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  gate:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Histórico inteiro: o portão calcula o merge-base com a base.
          fetch-depth: 0

      - name: Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Até o M0 não há Cargo.toml: o cache do cargo é pulado (como no job build).
      - name: Cargo.toml existe?
        id: cargo
        run: echo "present=$([ -f Cargo.toml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Cache do cargo
        if: steps.cargo.outputs.present == 'true'
        uses: Swatinem/rust-cache@v2

      # O gitleaks é instalado por go install (scripts/quality-gate-tools.sh).
      - name: Go (para o gitleaks)
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: false

      - name: Cache das ferramentas do portão
        id: tools
        uses: actions/cache@v6
        with:
          path: tmp/tools
          key: quality-gate-tools-${{ runner.os }}-${{ hashFiles('scripts/quality-gate-tools.sh') }}

      - name: Ferramentas do portão
        if: steps.tools.outputs.cache-hit != 'true'
        run: scripts/quality-gate-tools.sh

      - name: Base de comparação
        id: base
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          # PR: a base do PR. Push na main: o commit de antes. Disparo manual
          # em outra branch: o merge-base com a main. Primeiro push da main,
          # disparo manual na main ou execução semanal: base vazia, e o portão
          # varre o histórico inteiro em vez de fingir que nada mudou.
          if [ "$EVENT" = "pull_request" ]; then
            base="$PR_BASE"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            base="$BEFORE"
          elif git rev-parse --verify -q origin/main >/dev/null && [ "$(git rev-parse origin/main)" != "$(git rev-parse HEAD)" ]; then
            base="$(git merge-base origin/main HEAD)"
          else
            base=""
          fi
          echo "sha=$base" >> "$GITHUB_OUTPUT"
          echo "Base de comparação: ${base:-(histórico inteiro)}"

      - name: Portão
        run: scripts/quality-gate.sh --full --all --base "${{ steps.base.outputs.sha }}"

  build:
    # Linux e Windows (builds secundários, docs/BRIEF.md decisão 5): compilação
    # e testes; clippy e cargo-deny ficam no job gate, no macOS.
    # hashFiles só vale em steps.if (não em jobs.if): até o M0, sem
    # Cargo.toml, os passos são pulados e o job fica verde.
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - id: cargo
        shell: bash
        run: echo "present=$([ -f Cargo.toml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      # Bibliotecas de sistema que o eframe/winit precisam no Linux.
      - if: steps.cargo.outputs.present == 'true' && runner.os == 'Linux'
        name: Dependências de sistema (egui)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libxkbcommon-dev libwayland-dev libasound2-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxinerama-dev libxcursor-dev libxrandr-dev libxi-dev
      - if: steps.cargo.outputs.present == 'true'
        uses: dtolnay/rust-toolchain@stable
      - if: steps.cargo.outputs.present == 'true'
        uses: Swatinem/rust-cache@v2
      - if: steps.cargo.outputs.present == 'true'
        run: cargo build --workspace --locked
      - if: steps.cargo.outputs.present == 'true'
        run: cargo test --workspace --locked

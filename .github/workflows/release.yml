# @file: .github/workflows/release.yml
# Instaladores e Release (FEAT-016). Na tag v<versão> (push do Jean): confere que a tag é a versão
# do VERSION, monta os pacotes no sistema de cada um (cargo xtask bundle), confere o .deb num
# Debian limpo e cria a Release em rascunho com os pacotes e o SHA256SUMS; o Jean revê e publica
# (os pacotes não têm assinatura de código). Num pull request que toca o empacotamento, só monta
# e confere os pacotes, sem Release, para pegar quebra antes da tag.

name: Release

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'xtask/**'
      - 'packaging/**'
      - 'apps/hy-dbplus/**'
      - 'apps/hy-dbplus-cli/**'
      - 'VERSION'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/release.yml'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Só leitura; o job release, que cria a Release, pede escrita para si.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    # A tag tem de ser v + a versão do VERSION: antes de montar qualquer pacote.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Tag é a versão do VERSION
        if: github.event_name == 'push'
        run: cargo xtask version --check "$GITHUB_REF_NAME"

  macos:
    needs: check
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Bundle (.dmg universal)
        run: cargo xtask bundle --universal
      - uses: actions/upload-artifact@v7
        with:
          name: pkg-macos
          path: target/bundle/*.dmg
          if-no-files-found: error

  linux:
    needs: check
    # 22.04 (glibc 2.35): o binário roda nas distribuições de 2022 em diante, Debian 12 incluído;
    # montado no 24.04 ele exigiria a glibc 2.39.
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      # A mesma lista do job build do quality-gate.yml (eframe/winit).
      - name: Dependências de sistema (egui)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libxkbcommon-dev libwayland-dev libasound2-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxinerama-dev libxcursor-dev libxrandr-dev libxi-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Bundle (.deb e .tar.gz)
        run: cargo xtask bundle
      - name: Conteúdo do .deb
        run: |
          for deb in target/bundle/*.deb; do
            dpkg-deb --info "$deb"
            dpkg-deb --contents "$deb"
          done
          tar -tzf target/bundle/*.tar.gz
      # As bibliotecas de GL, Wayland e X11 são abertas por dlopen e não aparecem no ldd: o .deb
      # se instala num Debian limpo (o apt resolve o Depends) e o app abre sob Xvfb por 15 s. Sai
      # antes (pânico por biblioteca faltando, janela que não abre): falha. O Mesa e o Xvfb fazem o
      # papel do desktop; senha só em memória (sem chaveiro no contêiner).
      - name: Instala e abre num Debian limpo
        run: |
          docker run --rm -v "$PWD/target/bundle:/pkg:ro" debian:bookworm-slim bash -euc '
            apt-get update -qq
            apt-get install -y -qq /pkg/*.deb xvfb xauth libgl1-mesa-dri > /dev/null
            hy-dbplus-cli --version
            set +e
            HY_DBPLUS_SECRETS=memory timeout 15 xvfb-run -a hy-dbplus
            code=$?
            set -e
            if [ "$code" -ne 124 ]; then
              echo "o app saiu com $code antes de 15 s"
              exit 1
            fi
            echo "o app ficou aberto 15 s"
          '
      - uses: actions/upload-artifact@v7
        with:
          name: pkg-linux
          path: |
            target/bundle/*.deb
            target/bundle/*.tar.gz
          if-no-files-found: error

  windows:
    needs: check
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Bundle (.zip)
        run: cargo xtask bundle
      - name: Conteúdo do .zip
        shell: pwsh
        run: |
          Get-ChildItem target/bundle/*.zip | ForEach-Object {
            & "$env:SystemRoot\System32\tar.exe" -tf $_.FullName
          }
      - uses: actions/upload-artifact@v7
        with:
          name: pkg-windows
          path: target/bundle/*.zip
          if-no-files-found: error

  release:
    # Só na tag: a Release em rascunho com os pacotes e o SHA256SUMS.
    if: github.event_name == 'push'
    needs: [macos, linux, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: pkg-*
          path: dist
          merge-multiple: true
      - name: SHA256SUMS
        working-directory: dist
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      # Reexecução depois de falha no meio: o rascunho já existe, e os anexos sobem por cima. Release
      # já publicada não se regrava (quem baixou ficaria com um SHA256SUMS que não bate).
      - name: Release em rascunho
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          draft="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [ "$draft" = "true" ]; then
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
            exit 0
          fi
          if [ "$draft" = "false" ]; then
            echo "a Release $TAG já foi publicada: versão publicada não se regrava"
            exit 1
          fi
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --verify-tag \
            --title "hy-dbplus ${TAG#v}" \
            --generate-notes \
            --notes "Instaladores sem assinatura de código: no macOS, a primeira abertura pede botão direito → Abrir; no Windows, o SmartScreen pede \"Mais informações\" → \"Executar assim mesmo\". Confira os arquivos pelo SHA256SUMS."

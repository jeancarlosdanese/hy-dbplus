# @file: Cargo.toml
# Workspace do hy-dbplus (docs/BRIEF.md §5). Camadas: driver 0, catalog 1, sql 2, engine 3,
# automation e ui-egui 4; apps e xtask isentos. `cargo xtask layers` confere.

[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# Toda crate herda a licença: o cargo-deny reprova crate sem ela.
license = "MIT"
# Nenhuma crate vai para o crates.io; o app é distribuído como binário (M8).
publish = false
rust-version = "1.99"
repository = "https://github.com/jeancarlosdanese/hy-dbplus"

[workspace.dependencies]
# Crates internas: só por aqui, com `workspace = true` em cada Cargo.toml. Sem `version`:
# nada é publicado, e a versão do workspace sobe sem tocar estas linhas.
hy-dbplus-driver = { path = "crates/driver" }
hy-dbplus-catalog = { path = "crates/catalog" }
hy-dbplus-sql = { path = "crates/sql" }
hy-dbplus-engine = { path = "crates/engine" }
hy-dbplus-automation = { path = "crates/automation" }
hy-dbplus-ui-egui = { path = "crates/ui-egui" }

# Externas. Cada entrada é uma decisão registrada no impl-notes da FEAT que a trouxe.
# serde_json (MIT OR Apache-2.0): o xtask lê o `cargo metadata` (FEAT-002).
serde_json = "1"
# egui e eframe 0.36 (MIT OR Apache-2.0): a interface (FEAT-002). eframe sem as features
# padrão: desenha com glow (OpenGL), sem wgpu até o M3; wayland e x11 para o build Linux.
egui = "0.36"
# egui_extras 0.36 (MIT OR Apache-2.0): a tabela virtualizada da aba Data (FEAT-005); sem features.
egui_extras = { version = "0.36", default-features = false }
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
# FEAT-003 (M1), ver impl-notes: runtime, PostgreSQL por rustls com ring (sem aws-lc nem openssl),
# raízes do sistema, erros e serialização.
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "sync", "time", "net"] }
tokio-postgres = "0.7"
tokio-postgres-rustls = { version = "0.14", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
toml = "1"
# keyring 4: senha no Keychain (macOS), Credential Manager (Windows), Secret Service (Linux).
# uuid v4: id da conexão, conta no chaveiro (getrandom já no grafo via ring).
keyring = "4"
uuid = { version = "1", features = ["v4"] }
# egui_kittest 0.36 (MIT OR Apache-2.0): harness sem janela para testar a interação (FEAT-004);
# sem wgpu nem snapshot. Só dev-dependency.
egui_kittest = { version = "0.36", default-features = false }

# Never panic (CLAUDE.md): toda resposta do banco, arquivo e tecla é entrada não
# confiável. Em teste o clippy.toml libera unwrap, expect, panic e indexação.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
dbg_macro = "deny"

# Dependências otimizadas mesmo em dev (egui e o driver são pesados sem isso);
# o código nosso fica em opt-level 1 para compilar rápido.
[profile.dev.package."*"]
opt-level = 2
debug = "line-tables-only"

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
